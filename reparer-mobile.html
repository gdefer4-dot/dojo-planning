<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Réparation Planning Dojo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:Arial,sans-serif;background:#0f172a;color:#0f172a}
  .card{width:min(620px,100%);background:white;border-radius:28px;padding:30px;
        text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.35)}
  h1{margin:0 0 14px;font-size:30px}
  p{font-size:18px;line-height:1.5}
  .spinner{width:48px;height:48px;margin:22px auto;border:5px solid #dbeafe;
           border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
  .ok{color:#166534;font-weight:800}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <h1>🔧 Réparation de l’application</h1>
  <div class="spinner" id="spinner"></div>
  <p id="status">Suppression des anciens caches et de l’ancien service worker…</p>
</main>
<script>
(async function reparer() {
  const status = document.getElementById("status");
  try {
    if ("serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg => reg.unregister()));
    }

    if ("caches" in window) {
      const noms = await caches.keys();
      await Promise.all(noms.map(nom => caches.delete(nom)));
    }

    [
      "dojo-version-active",
      "dojo-version-chargee",
      "dojo-recharge-V48.0.0",
      "dojo-recharge-V48.1.0"
    ].forEach(cle => localStorage.removeItem(cle));

    sessionStorage.clear();

    status.className = "ok";
    status.textContent = "✅ Nettoyage terminé. Ouverture de la nouvelle version…";

    setTimeout(() => {
      location.replace("./index.html?fresh=" + Date.now());
    }, 900);
  } catch (error) {
    status.textContent =
      "Le nettoyage automatique n’a pas pu se terminer. Fermez complètement le navigateur, puis rouvrez cette page.";
  }
})();
</script>
</body>
</html>
